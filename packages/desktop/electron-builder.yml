# Packaging for the desktop shell (`pnpm --filter @puddle-code/desktop dist`).
# The bundle is self-contained (dist/ carries main, preloads, install.sh and
# the web UI); install.sh is READ from inside app.asar (Electron patches fs).
# The SSH askpass helper (with ssh-askpass.exe, its Windows launcher) is the
# only unpacked code because Electron's run-as-Node mode executes it as a
# real script from a child process.
#
# Developer ID signing is environment-driven: electron-builder signs when
# CSC_LINK + CSC_KEY_PASSWORD are set, and the release workflow adds
# `-c.mac.notarize=true` (needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID) only when the certificate secrets exist — see
# .github/workflows/release.yml "desktop" job. Without certificate secrets,
# releases use `-c.mac.identity=- -c.mac.hardenedRuntime=false` to seal the app
# with an ad-hoc signature (its frameworks have no Team ID for library validation);
# unset empty CSC_LINK/CSC_KEY_PASSWORD first so missing GitHub secrets cannot
# trigger certificate import. Packaging uses --publish never; the release job
# publishes the completed artefact set after every build passes.
# `identity=null` leaves Electron's linker signature without a bound app identity.
# Icon: build/icon.icns (mac, from the full-bleed icon-mac.svg — macOS 26+
# applies its own squircle mask) and build/icon.png (linux, from icon.svg,
# self-rounded) are picked up from the default buildResources dir — rendered
# by scripts/render-icon.sh, and committed so CI needs no rasteriser. Windows
# converts the same 1024² build/icon.png into the executable's .ico.
#
# Windows (docs/windows.md): per-user one-click NSIS installers for x64 and
# arm64, one architecture per invocation (`--x64` or `--arm64`; without a flag
# the host's): passing both would make one universal installer whose name has
# no architecture. They share the GUID, so either replaces the other in
# place. Authenticode signing is environment-driven, as on macOS: the release
# workflow's desktop-windows job supplies WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD or
# `-c.win.azureSignOptions.*` (Azure Trusted Signing) with
# `-c.forceCodeSigning=true` only when signing secrets exist; without them the
# installer stays unsigned and the signtool options below are inert. The
# appId doubles as the Start Menu shortcut's AppUserModelID, which main.ts
# sets so toasts appear. lib/installation/desktop-update.ts reads the
# installer's registry keys through the pinned GUID (electron-builder's
# default for this appId) and selects `*-<arch>-setup.exe` by the operating
# system's architecture, so keep both stable.
appId: code.puddle.desktop
productName: Puddle
copyright: Copyright © 2026 Yiding Song
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - dist/askpass-helper.cjs
  # Windows only: OpenSSH's SSH_ASKPASS program (built by scripts/build.mjs).
  - dist/ssh-askpass.exe
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
linux:
  # Without this, electron-builder derives the executable name from the package
  # name (`@puddle-code/desktop` → `@puddle-codedesktop`) and the AppImage build rejects
  # the `@` as unsafe in file paths.
  executableName: puddle-desktop
  # Name the installed .desktop file after `desktopName` in package.json so it
  # matches StartupWMClass and Electron's app_id (window association).
  syncDesktopName: true
  target:
    - AppImage
  category: Development
win:
  # Puddle.exe: code and the update flow look for this name and for the
  # uninstaller ("Uninstall Puddle.exe") beside it.
  executableName: Puddle
  # No `arch:` list: a pinned one silently overrides --arm64.
  target:
    - nsis
  # Electron's own DLLs (ffmpeg, libEGL, vk_swiftshader…) besides the .exe files.
  signExts:
    - .dll
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: true
  perMachine: false
  # The 32-bit elevate.exe serves electron-updater's per-machine installs,
  # which this per-user installer and lib/desktop-update never use.
  packElevateHelper: false
  guid: 21877822-4423-5e9b-90ab-0b75b071b1b1
  # No spaces: GitHub renames them in asset names, which must match SHA256SUMS.
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false
