name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pinned version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          # Workflows build the desktop shell with esbuild only and never
          # launch Electron - skip its ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install isolated Jupyter test environment
        run: |
          python -m venv "$RUNNER_TEMP/notebook-python"
          "$RUNNER_TEMP/notebook-python/bin/python" -m pip install nbconvert==7.17.1 nbclient==0.11.0 jupyter-client==8.6.3 ipykernel==7.1.0 ipywidgets==8.1.8
          echo "$RUNNER_TEMP/notebook-python/bin" >> "$GITHUB_PATH"
      - run: pnpm test
      - run: pnpm test:e2e
      - name: provision loopback OpenSSH tests
        run: sudo apt-get update && sudo apt-get install -y openssh-server && sudo mkdir -p /run/sshd
      - run: pnpm test:ssh
      - name: install isolated mobile test browser
        run: pnpm --filter @puddle/web exec playwright install --with-deps chromium
      - run: pnpm test:mobile
      - name: validate self-hosted deployment configuration
        run: |
          # Compose also loads the service's env_file, independently of --env-file.
          trap 'rm -f deploy/remote/.env' EXIT
          install -m 600 deploy/remote/.env.example deploy/remote/.env
          docker compose --env-file deploy/remote/.env -f deploy/remote/compose.yaml config -q
      - name: exercise container builds from a private checkout
        run: git ls-files -z | xargs -0 chmod go-rwx
      - name: build self-hosted service image
        run: docker build -f deploy/remote/Dockerfile.service -t puddle-remote-service:test .
      - name: build trusted application image
        run: docker build -f deploy/remote/Dockerfile.app --build-arg PUDDLE_REMOTE_SERVICE=https://relay.example.test -t puddle-remote-app:test .
      - name: verify hardened remote container startup and static files
        run: node deploy/remote/test-images.mjs
      - name: assert web assets ship inside the CLI
        run: test -f packages/cli/dist/public/index.html && test -f packages/cli/dist/install.sh && test -f packages/cli/dist/host-control.mjs && test -f packages/cli/dist/install-cli.sh && test -f packages/cli/dist/install-cli.ps1
      # Self-smoke-tests the staged tree (puddled --version loads both native
      # modules), so the release packaging cannot rot between tags.
      - name: build the daemon tarball
        run: pnpm build:tarball
      - name: build and exercise standalone CLI without system Node or npm
        run: |
          pnpm build:cli-tarball
          node scripts/test-cli-tarball.mjs

  # Native Windows (docs/windows.md): the suite, the daemon and CLI zips with
  # their smoke tests, and install.ps1 end to end, including the user PATH
  # edit this disposable runner allows. Docker, sshd, the process e2e and
  # mobile browser suites stay on Linux. PowerShell runs every step, as on a
  # user's machine, where Git's Unix tools are not on PATH and `bash` may be
  # WSL's System32 stub: no test or script can come to depend on Git Bash.
  ci-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pinned version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          # The suite never launches Electron - skip its ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install isolated Jupyter test environment
        run: |
          python -m venv "$env:RUNNER_TEMP\notebook-python"
          & "$env:RUNNER_TEMP\notebook-python\Scripts\python.exe" -m pip install nbconvert==7.17.1 nbclient==0.11.0 jupyter-client==8.6.3 ipykernel==7.1.0 ipywidgets==8.1.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\notebook-python\Scripts"
      - run: pnpm test
      - run: pnpm test:e2e
      - name: build the daemon zip
        run: pnpm build:tarball
      # Separate steps: pwsh would carry on past a failed native command.
      - name: build the standalone CLI zip
        run: pnpm build:cli-tarball
      - name: exercise standalone CLI without system Node or npm
        run: node scripts/test-cli-tarball.mjs
      # scripts/lib/windows-sign.mjs with a throwaway self-signed certificate,
      # trusted only on this disposable runner: it must sign and timestamp
      # the unsigned PE files, leave publisher-signed ones byte-identical, and
      # the signed tree must still pass the smoke tests. No secret is used.
      - name: Authenticode signing dry run
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Puddle CI signing dry run' -CertStoreLocation Cert:\CurrentUser\My
          $root = New-Object Security.Cryptography.X509Certificates.X509Store 'Root', 'LocalMachine'
          $root.Open('ReadWrite'); $root.Add($cert); $root.Close()
          $password = [Guid]::NewGuid().ToString('N')
          $pfx = Join-Path $env:RUNNER_TEMP 'dry-run.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          $env:WIN_CSC_LINK = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          $env:WIN_CSC_KEY_PASSWORD = $password
          $env:PUDDLE_WINDOWS_SIGNING = 'certificate'
          $out = Join-Path $env:RUNNER_TEMP 'signed'
          node scripts/build-tarball.mjs --stage-only --out-dir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = (Get-ChildItem -LiteralPath (Join-Path $out 'stage') -Directory | Select-Object -First 1).FullName
          $runtime = Get-ChildItem -LiteralPath node_modules\.cache\puddle-node-runtime -Recurse -Filter node.exe | Select-Object -First 1
          if ((Get-FileHash (Join-Path $stage 'bin\node.exe')).Hash -ne (Get-FileHash $runtime.FullName).Hash) { throw 'node.exe was re-signed' }
          foreach ($file in Get-ChildItem -LiteralPath $stage -Recurse -File | Where-Object { @('.exe', '.dll', '.node') -contains $_.Extension.ToLowerInvariant() }) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.FullName) is $($signature.Status)" }
            Write-Output "$($file.Name): $($signature.SignerCertificate.Subject)"
          }

  # Windows on Arm, natively: arm64 Node, the arm64 daemon zip (its smoke test
  # spawns arm64 ConPTY and opens arm64 SQLite), the arm64 CLI zip with
  # install.ps1 end to end (OS architecture detection, junction upgrades and
  # removal), and the installation and architecture tests.
  ci-windows-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64
          cache: pnpm
      - name: require a native Node
        run: |
          $arch = node -p process.arch
          if ($arch -ne 'arm64') { throw "Node is $arch, not arm64" }
      - run: node scripts/install-ci.mjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build
      - name: build the daemon zip
        run: pnpm build:tarball
      - name: build the standalone CLI zip
        run: pnpm build:cli-tarball
      - name: exercise standalone CLI without system Node or npm
        run: node scripts/test-cli-tarball.mjs
      # windows-install.test.ts stays on the x64 job until windows-install.ts
      # asks windowsHostArch() for its archive: today it downloads the
      # process's win32-<arch> zip, which the test pins to win32-x64.
      - name: installation and Windows architecture tests
        run: pnpm exec vitest run packages/cli/test/installation packages/shared/test --exclude '**/windows-install.test.ts'

  # The ordinary build above proves packaging on the current hosted image.
  # This second job exercises the actual release container before a tag: native
  # compiler, old ABI floor, both architectures, staged-daemon smoke test.
  release-tarball-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    container: rockylinux:8
    steps:
      - name: install native build toolchain
        run: dnf install -y binutils git gcc-toolset-14-gcc-c++ make python3.11 tar gzip xz
      - name: verify native ABI floor
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.28'
          /opt/rh/gcc-toolset-14/root/usr/bin/g++ -std=c++20 -x c++ -fsyntax-only /dev/null
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          CC: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
          CXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
          LDFLAGS: -static-libgcc -static-libstdc++
          npm_config_build_from_source: 'true'
          npm_config_python: /usr/bin/python3.11
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build:tarball
      - name: verify packaged native ABI
        run: node scripts/check-linux-native-abi.mjs dist-release/stage
