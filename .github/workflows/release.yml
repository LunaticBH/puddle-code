name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball-linux:
    strategy:
      # Let both native architectures finish so one failure cannot hide the
      # other architecture's result (as happened in v0.0.44 and v0.0.45).
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    # node-pty is node-gyp-built, so the build container fixes the native ABI
    # floor at glibc 2.28 (RHEL/Rocky 8) instead of inheriting the hosted
    # runner's glibc 2.35. Node 22's official binary has the same floor.
    container: rockylinux:8
    steps:
      - name: install native build toolchain
        # Rocky 8's system GCC 8 rejects better-sqlite3's -std=c++20 and its
        # unversioned Python 3.6 cannot parse node-gyp 12. Use supported modern
        # toolsets without raising the container's glibc 2.28 floor.
        run: dnf install -y binutils git gcc-toolset-14-gcc-c++ make python3.11 tar gzip xz
      - name: verify native ABI floor
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.28'
          /opt/rh/gcc-toolset-14/root/usr/bin/g++ -std=c++20 -x c++ -fsyntax-only /dev/null
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          CC: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
          CXX: /opt/rh/gcc-toolset-14/root/usr/bin/g++
          # The toolset's newer runtime is a build dependency, not a host
          # requirement. Keep the shipped addons free of GLIBCXX/CXXABI deps.
          LDFLAGS: -static-libgcc -static-libstdc++
          npm_config_build_from_source: 'true'
          npm_config_python: /usr/bin/python3.11
          # Workflows build the desktop shell with esbuild only and never
          # launch Electron - skip its ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/build-tarball.mjs --version "${GITHUB_REF_NAME#v}"
      - name: build standalone CLI archive
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
        run: |
          pnpm --filter @puddle/web... build
          pnpm --filter @puddle-code/cli build
          node scripts/build-cli-tarball.mjs --version "${GITHUB_REF_NAME#v}"
          node scripts/test-cli-tarball.mjs
      - name: verify packaged native ABI
        run: node scripts/check-linux-native-abi.mjs dist-release/stage
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          if-no-files-found: error

  tarball-darwin:
    # darwin-x64 is unpublished while GitHub's last Intel runner queues too
    # slowly to block releases; restore it (or build under Rosetta) if needed.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/build-tarball.mjs --version "${GITHUB_REF_NAME#v}"
      - name: build standalone CLI archive
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
        run: |
          pnpm --filter @puddle/web... build
          pnpm --filter @puddle-code/cli build
          node scripts/build-cli-tarball.mjs --version "${GITHUB_REF_NAME#v}"
          node scripts/test-cli-tarball.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-darwin-arm64
          path: |
            dist-release/*.tar.gz
            dist-release/*.sha256
          if-no-files-found: error

  tarball-windows:
    # Native win32-x64 and win32-arm64 zips (docs/windows.md), each built and
    # smoke-tested on its own architecture: the arm64 smoke test spawns arm64
    # ConPTY and opens arm64 SQLite. PowerShell runs the steps, as on a user's
    # machine; the archives and installers never need Git Bash.
    #
    # Authenticode signing is optional. The secret WIN_CSC_LINK (a base64 PFX,
    # with WIN_CSC_KEY_PASSWORD) selects a certificate; otherwise the
    # repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID,
    # AZURE_SUBSCRIPTION_ID (an OIDC federated credential for azure/login) and
    # AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE and
    # AZURE_SIGNING_PUBLISHER (the certificate subject's CN, which
    # electron-builder requires in desktop-windows) select Azure Trusted
    # Signing; AZURE_CLIENT_ID with AZURE_SIGNING_ENDPOINT selects it, and a
    # missing variable of the set then fails the job rather than shipping
    # unsigned. Both Windows jobs apply the same rule, so the archives and the
    # installers are never signed differently. With neither, nothing is signed
    # and the archives are built exactly as before.
    # scripts/lib/windows-sign.mjs signs before the smoke tests and the
    # checksums.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: win32-x64, arch: x64 }
          - { runner: windows-11-arm, target: win32-arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # azure/login, only when Azure Trusted Signing is configured
    defaults:
      run:
        shell: pwsh
    env:
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - name: select Authenticode signing
        env:
          # Only whether the secret exists: it reaches the signing steps alone.
          HAS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK != '' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $mode = if ($env:HAS_CERTIFICATE -eq 'true') { 'certificate' } elseif ($env:AZURE_CLIENT_ID -and $env:AZURE_SIGNING_ENDPOINT) { 'azure' } else { 'none' }
          if ($mode -eq 'azure') {
            $missing = @('AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE', 'AZURE_SIGNING_PUBLISHER' |
              Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
            if ($missing.Count -gt 0) { throw "Azure Trusted Signing also needs the repository variables $($missing -join ', ')" }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PUDDLE_WINDOWS_SIGNING=$mode"
          Write-Output "Authenticode signing: $mode"
      - uses: azure/login@v2
        if: env.PUDDLE_WINDOWS_SIGNING == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: require a native Node
        # An emulated Node would install and smoke-test the other
        # architecture's native modules.
        run: |
          $arch = node -p process.arch
          if ($arch -ne '${{ matrix.arch }}') { throw "Node is $arch, not ${{ matrix.arch }}" }
      - run: node scripts/install-ci.mjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: build the daemon zip
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/build-tarball.mjs --version ($env:GITHUB_REF_NAME -replace '^v', '') --arch ${{ matrix.arch }}
      - name: build standalone CLI archive
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        # pwsh carries on past a failed native command unless told to stop.
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          pnpm --filter @puddle/web... build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @puddle-code/cli build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-cli-tarball.mjs --version $version --arch ${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-cli-tarball.mjs
      - name: verify Authenticode signatures
        if: env.PUDDLE_WINDOWS_SIGNING != 'none'
        run: |
          $files = @(Get-ChildItem -LiteralPath dist-release\stage -Recurse -File |
            Where-Object { @('.exe', '.dll', '.node', '.ps1') -contains $_.Extension.ToLowerInvariant() })
          $bad = @(foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { "$($file.FullName) ($($signature.Status))" }
          })
          if ($files.Count -eq 0) { throw 'no signable files in dist-release\stage' }
          if ($bad.Count -gt 0) { throw ("not validly signed and timestamped:`n  " + ($bad -join "`n  ")) }
          Write-Output "$($files.Count) files are validly signed and timestamped"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: |
            dist-release/*.zip
            dist-release/*.sha256
          if-no-files-found: error

  desktop:
    # Packages the Electron shell (packages/desktop). With MAC_CERT_P12 +
    # MAC_CERT_PASSWORD set, the mac build is signed under hardened runtime
    # and — with APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID —
    # notarised; without them an ad-hoc signature seals the app's identity and
    # resources. This does not provide Developer ID trust or OS notification
    # approval. AppImage needs no signing. Windows installers are packaged by
    # desktop-windows below, entirely in PowerShell.
    strategy:
      matrix:
        include:
          - { runner: macos-14, target: darwin-arm64 }
          - { runner: ubuntu-22.04, target: linux-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/install-ci.mjs
        env:
          # electron-builder fetches its own Electron dist at package time;
          # the node_modules binary is never launched here.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build
        env:
          # Bakes the release-source repository into the bundled lib so the
          # embedded bootstrap fetches daemon tarballs from the repo that
          # published it (same as the npm CLI build).
          PUDDLE_REPO_SLUG: ${{ github.repository }}
      - name: package (ad-hoc signing without certificate secrets)
        if: runner.os != 'Windows'
        working-directory: packages/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" != "macOS" ]; then
            pnpm exec electron-builder --publish never
          elif [ -n "$CSC_LINK" ]; then
            pnpm exec electron-builder --publish never -c.mac.notarize=true
          else
            echo "no signing certificate secrets — sealing with an ad-hoc signature"
            # GitHub supplies missing secrets as empty strings. electron-builder
            # treats an empty CSC_LINK as a certificate path (the working directory).
            unset CSC_LINK CSC_KEY_PASSWORD
            # Ad-hoc frameworks have no Team ID for hardened runtime library
            # validation. Keep that runtime exclusive to Developer ID builds.
            pnpm exec electron-builder --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
          fi
      # PowerShell runs the Windows steps, as on a user's machine. No CSC_*
      # variables: electron-builder would offer the Apple certificate to
      # Authenticode, and the v1 installer is unsigned.
      - name: package (Windows, unsigned)
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        shell: pwsh
        run: pnpm exec electron-builder --publish never
      - name: verify macOS app signature
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Puddle.app
      - name: checksums
        if: runner.os != 'Windows'
        working-directory: packages/desktop/release
        shell: bash
        run: |
          for f in *.dmg *.zip *.AppImage; do
            if [ ! -f "$f" ]; then continue; fi
            shasum -a 256 "$f"
          done > desktop-${{ matrix.target }}.sha256
      # shasum's `<lowercase sha256>  <name>` lines with LF endings, which
      # install.ps1 and desktop-update compare against asset names.
      - name: checksums (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/desktop/release
        shell: pwsh
        run: |
          $lines = foreach ($pattern in '*.zip', '*-setup.exe') {
            foreach ($file in Get-ChildItem -File -Path $pattern) {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
              "$hash  $($file.Name)`n"
            }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'desktop-${{ matrix.target }}.sha256'), -join $lines)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          # Explicit globs on purpose: never the .blockmap / latest-*.yml
          # electron-updater metadata — the desktop app self-updates through
          # lib/desktop-update (SPEC §10), which consumes the artefacts +
          # SHA256SUMS directly, not Squirrel's metadata.
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.sha256
          if-no-files-found: error

  desktop-windows:
    # The per-user NSIS installers Puddle-<v>-x64-setup.exe and
    # Puddle-<v>-arm64-setup.exe, one architecture per runner and per
    # electron-builder run (both in one run would make a single installer
    # with no architecture in its name). Signing follows tarball-windows: a
    # certificate reaches electron-builder as WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD,
    # Azure Trusted Signing as -c.win.azureSignOptions.* (the endpoint,
    # account and certificate profile, and the publisherName that
    # electron-builder's schema requires: AZURE_SIGNING_PUBLISHER, the
    # certificate subject's CN), and either adds -c.forceCodeSigning=true, so
    # a signing failure fails the release. The Apple certificate (CSC_LINK) is
    # never exported here: electron-builder would offer it to Authenticode.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: win32-x64, arch: x64, unpacked: win-unpacked }
          - {
              runner: windows-11-arm,
              target: win32-arm64,
              arch: arm64,
              unpacked: win-arm64-unpacked,
            }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # azure/login, only when Azure Trusted Signing is configured
    defaults:
      run:
        shell: pwsh
    env:
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - name: select Authenticode signing
        env:
          HAS_CERTIFICATE: ${{ secrets.WIN_CSC_LINK != '' }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $mode = if ($env:HAS_CERTIFICATE -eq 'true') { 'certificate' } elseif ($env:AZURE_CLIENT_ID -and $env:AZURE_SIGNING_ENDPOINT) { 'azure' } else { 'none' }
          if ($mode -eq 'azure') {
            $missing = @('AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE', 'AZURE_SIGNING_PUBLISHER' |
              Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
            if ($missing.Count -gt 0) { throw "Azure Trusted Signing also needs the repository variables $($missing -join ', ')" }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PUDDLE_WINDOWS_SIGNING=$mode"
          Write-Output "Authenticode signing: $mode"
      - uses: azure/login@v2
        if: env.PUDDLE_WINDOWS_SIGNING == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: require a native Node
        run: |
          $arch = node -p process.arch
          if ($arch -ne '${{ matrix.arch }}') { throw "Node is $arch, not ${{ matrix.arch }}" }
      - run: node scripts/install-ci.mjs
        env:
          # electron-builder fetches its own Electron dist at package time;
          # the node_modules binary is never launched here.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm build
        env:
          PUDDLE_REPO_SLUG: ${{ github.repository }}
      - name: package
        working-directory: packages/desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $sign = @(switch ($env:PUDDLE_WINDOWS_SIGNING) {
            'azure' {
              "-c.win.azureSignOptions.endpoint=$env:AZURE_SIGNING_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_SIGNING_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_SIGNING_PROFILE"
              "-c.win.azureSignOptions.publisherName=$env:AZURE_SIGNING_PUBLISHER"
              '-c.forceCodeSigning=true'
            }
            'certificate' { '-c.forceCodeSigning=true' }
          })
          # GitHub supplies missing secrets as empty strings.
          if ($env:PUDDLE_WINDOWS_SIGNING -ne 'certificate') {
            Remove-Item Env:WIN_CSC_LINK, Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          pnpm exec electron-builder --win --${{ matrix.arch }} --publish never @sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: verify the installer architecture
        # electron-builder's resources\elevate.exe is x86 for every architecture.
        run: node scripts/check-windows-arch.mjs packages/desktop/release/${{ matrix.unpacked }} ${{ matrix.arch }} --except resources/elevate.exe
      - name: verify Authenticode signatures
        if: env.PUDDLE_WINDOWS_SIGNING != 'none'
        working-directory: packages/desktop/release
        run: |
          $files = @(Get-ChildItem -File -Filter '*-setup.exe') + @(Get-ChildItem -LiteralPath '${{ matrix.unpacked }}' -Recurse -File |
            Where-Object { @('.exe', '.dll') -contains $_.Extension.ToLowerInvariant() })
          $bad = @(foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { "$($file.FullName) ($($signature.Status))" }
          })
          if ($bad.Count -gt 0) { throw ("not validly signed and timestamped:`n  " + ($bad -join "`n  ")) }
          Write-Output "$($files.Count) files are validly signed and timestamped"
      - name: checksums
        working-directory: packages/desktop/release
        # Lower-case hex, LF and a final newline: what parseSums and install.ps1 read.
        run: |
          $installers = @(Get-ChildItem -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1 -or $installers[0].Name -notlike '*-${{ matrix.arch }}-setup.exe') {
            throw "expected one *-${{ matrix.arch }}-setup.exe, found: $($installers.Name -join ', ')"
          }
          $lines = @($installers | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name
          })
          [IO.File]::WriteAllText((Join-Path $PWD.Path 'desktop-${{ matrix.target }}.sha256'), ($lines -join "`n") + "`n")
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          # The installer and its checksum only: never the .blockmap or
          # latest.yml electron-updater metadata (lib/desktop-update reads
          # SHA256SUMS).
          path: |
            packages/desktop/release/*-setup.exe
            packages/desktop/release/*.sha256
          if-no-files-found: error

  release:
    needs: [tarball-linux, tarball-darwin, tarball-windows, desktop, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist-release
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist-release
      - name: assemble SHA256SUMS and the public CLI installers
        run: |
          cat dist-release/*.sha256 > dist-release/SHA256SUMS
          node scripts/stage-installers.mjs dist-release "$GITHUB_REPOSITORY"
      - name: extract release notes from the changelog
        # The notes come from docs/changelogs/CHANGELOG-v<version>.md, cut in
        # the release commit — the single source of truth for both this release
        # and the npm package (CLAUDE.md §"Changelog discipline").
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME#v}" > dist-release/RELEASE_NOTES.md
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-release/*.tar.gz \
            dist-release/*.dmg \
            dist-release/*.zip \
            dist-release/*.AppImage \
            dist-release/*-setup.exe \
            dist-release/SHA256SUMS \
            dist-release/install.sh \
            dist-release/install.ps1 \
            --verify-tag --notes-file dist-release/RELEASE_NOTES.md

  npm-publish:
    # Configure this repository and release.yml as a trusted publisher in
    # the npm package settings, with direct publishing allowed (SPEC §10).
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10, which cannot authenticate through npm OIDC.
      - name: install npm with trusted publishing support
        run: npm install --global npm@11.21.0
      - name: verify package version matches the release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          if (`v${version}` !== process.env.GITHUB_REF_NAME) {
            throw new Error('The CLI package version must match the release tag.');
          }
          NODE
      - name: install dependencies
        run: node scripts/install-ci.mjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: build the CLI and embedded assets
        env:
          # Bakes the release-source repository into the CLI bundle so its
          # bootstrap fetches tarballs from the repo that published it.
          PUDDLE_REPO_SLUG: ${{ github.repository }}
        run: pnpm build
      - name: publish to npm using trusted publishing
        # Not `npm publish -w`: this is a pnpm workspace, so npm sees no
        # workspaces at the root — publish from the package directory. Do not
        # supply NODE_AUTH_TOKEN: npm obtains a short-lived token through OIDC.
        working-directory: packages/cli
        run: npm publish --provenance --access public
